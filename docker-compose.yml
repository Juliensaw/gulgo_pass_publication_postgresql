services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gulgo_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gulgo_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulgo_owner -d gulgo_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./sql/002_integrity_security.sql:/docker-entrypoint-initdb.d/002_integrity_security.sql:ro
      - ./sql/003_access_roles.sql:/docker-entrypoint-initdb.d/003_access_roles.sql:ro
      - ./sql/004_controlled_writes.sql:/docker-entrypoint-initdb.d/004_controlled_writes.sql:ro
      - ./sql/005_integrity_hardening.sql:/docker-entrypoint-initdb.d/005_integrity_hardening.sql:ro
      - ./sql/006_rls_owner_compatibility.sql:/docker-entrypoint-initdb.d/006_rls_owner_compatibility.sql:ro
      - ./sql/007_runtime_login.sql:/docker-entrypoint-initdb.d/007_runtime_login.sql:ro
      - ./sql/008_definer_search_path.sql:/docker-entrypoint-initdb.d/008_definer_search_path.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
